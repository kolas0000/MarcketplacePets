<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reg">
        <div class="register">
        <img src="photo/Vector (1).png">
        <p>Регистрация</p>
        </div>
        <form class="forms" action="php/registerClient.php" method="post">
            <input type="text" placeholder="введите свое имя" name="Name" required>
            <input type="text" placeholder="Введите свою фамилию" name="Surname" required>
            <input type="text" placeholder="Введите свое отчество" name="MiddleName" required>
            <input type="password" minlength ="8" placeholder="Введите пароль" name="password_user" required>
            <input type="phone"  pattern="\8\s?[\(]{0,1}9[0-9]{2}[\)]{0,1}\s?\d{3}-?\d{2}-?\d{2}" placeholder="8 (999) 999-99-99" name="phone" required>
            <input type="email" placeholder="Введите свою почту" name="email" required>
            <input type="text" placeholder="Введите свой адрес" name="address" required>
            <input type="submit" value="Зарегистрироваться">
        </form>
    </div>
</body>
</html>

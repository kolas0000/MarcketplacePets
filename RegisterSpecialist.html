<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reg">
        <div class="register">
        <img src="photo/Vector (1).png">
        <p>Регистрация</p>
        </div>
        <form class="forms">
            <input type="text" placeholder="введите свое имя">
            <input type="text" placeholder="Введите свою фамилию">
            <input type="text" placeholder="Введите свое отчество">
            <input type="password" placeholder="Введите пароль">
            <input type="phone"  pattern="\8\s?[\(]{0,1}9[0-9]{2}[\)]{0,1}\s?\d{3}-?\d{2}-?\d{2}" placeholder="8 (999) 999-99-99">
            <input type="email" placeholder="Введите свою почту">
            <select>
                <option value="0">Грумер</option>
            </select>
            <input type="number" placeholder="Введите ваш опыт работы">
            <input type="file" placeholder="Прикрепите документ для подтверждения">
            <input type="submit" value="Зарегистрироваться">
        </form>
    </div>
</body>
</html>
